2. **Environment / tool inventory.** Cut where the tools a bullet needs materially change: headless C#
   (.NET SDK, `dotnet test`) → Unity C# (UnityEngine references, no Editor session) → Unity Editor
   (MCP tools, `tests-run EditMode`, prefabs, scenes, importers) → external tools (`visual-judge.sh`
   and other CLIs). Every transition is a candidate cut because the two sides pay different tool costs,
   verify with different tool sets, and can in principle run on different processes. Use this axis when
   axis 1 gives a weak or single cut but the spec spans multiple envs.

3. **Layer / dependency.** Cut at Domain / Application / Presentation boundaries when the spec is one
   env end-to-end and file groups overlap (e.g. shared aggregate types). Layer cuts usually reduce to
   axis 1 once each layer's files are enumerated.

4. **Bullet count — fallback only.** If none of the above surfaces a boundary, cut at the group heading
   nearest the middle of the Execution list, otherwise at the bullet nearest the middle. Never make a
   cut that interleaves the two halves — the list is dependency-ordered, so a prefix/suffix cut is
   always safe.

Name the axis and the boundary in your step-03 output. For every cut, list each stage's **owned file
globs** (the union of the file paths named by that stage's bullets, generalised to globs when a whole
directory is in play).

**File ownership is the contract.** A later stage does not rewrite an earlier stage's owned files — it
builds on them. If a stage cannot close a task without work belonging to another stage's files, it
leaves the task, names it in its report, and moves on; it never reaches across the boundary to finish
it. A stage that writes outside its owned globs is a bug in the split — re-do the axis choice, not the
edit.

**Closeout is ONE stage for the whole split, not one per parent stage.** When the stages have all
reported, collect **every** unclosed bullet from **every** stage report — whoever reported it and
whichever stage owns the file — and dispatch **one** closeout stage with a fresh context on the same
model the stages run on. Its owned globs are the **union** of the globs of the stages whose files
those bullets name. By this point nothing runs in parallel and no stage is still writing, so the
file-ownership contract is protecting nothing: splitting closeout along glob lines buys one more cold
start and one more full verify cycle, and buys them for nothing. Measured on story 7.1: three items
came out of a single Stage-3 report and were split into two recovery agents because the rule said
*per parent stage* — 11.0 min / $5.22 and 34.5 min / $15.01, of which **51% and 69% respectively was
re-running `gate.sh` and the EditMode suite a second time** on a change whose whole unblocking payload
was three lines of asmdef, one prefab number and four addressables entries.

If the closeout stage itself reports unclosed bullets, HALT with `intent_gap` in the run's ATTENTION
file and hand back to the operator — do not spiral into a second attempt. Fixes for defects surfaced
by step-04 review go through the patch branch, not through a new implementation stage.

Give each stage this prompt, with `<STAGE>` replaced by its sentence from the table below, `<FILES>`
replaced by its owned file globs (one per line), and — for every stage after the first — the previous
stage's report appended verbatim underneath that sentence:

> Read {spec_file}'s **contract** in full and implement it — the spec is the sole source of truth. The contract is the frontmatter and every section from `## Intent` through `## Implementation Notes`, plus `## Design Notes` and `## Verification`. Its **logs** — `## Spec Change Log`, `## Review Triage Log`, `## Auto Run Result` — are not required reading: the previous stage's report is appended below, and you open one log entry by line range only when that report or a bullet sends you to it (`grep -n '^##' {spec_file}` maps every section in one call; then `read {spec_file}:L1-L2`). Measured on story 7.3: the spec every stage agent read *fully* had grown to 136 kB by the patch stage, 59% of it those logs, and stage agents read it whole 12 times — 16.6% of every tool byte the story's agents re-sent. Load every file listed in its frontmatter `context:` before you start.
>
> **<STAGE>**
>
> **Your owned file globs.** Every write you make must land inside this set:
>
> <FILES>
>
> If a task would need a write outside this set, leave it, name it in your report with the file it needed, and move on. Never edit a file another stage owns.
>
> **Stop before you sprawl.** If you are still working after roughly 120 tool calls, stop where the code is consistent, write your findings down as instructed below, and report what is done and what remains. A fresh agent continues from the spec and your report — that is cheaper than one more turn on a context this size, and it is not a failure.
>
> **Round-trip discipline.** Every turn re-sends your whole context to the model, so one extra turn costs far more than one extra tool call inside a turn. Batch by dependency, not by habit:
>
> - **Every independent `Read` goes in the SAME message, too.** `Read` is not a shell command, so the pf-exec rule does not reach it and the contract is easy to satisfy on paper while still spending one turn per file. Ten files you already know you want are ONE message carrying ten `Read` calls, or one `pf-exec` with ten `read FILE:L1-L2` items — never ten turns. Measured on this project: an implementer that had already copied ten prior-art files into one folder with a single command then read them back **one per turn** — ten model turns for one message's work.
> - **Every independent shell command goes through `Tools/pf/pf-exec` — it is the batched SHELL door, not an inspection tool.** Reads and greps, but equally `dotnet build`, `dotnet test`, a gate script, a `git` query, a `ls ~/.nuget`. N commands in ONE call, run in parallel, **each result capped** so one fat output cannot flood a context you re-send for the rest of the stage. Measured on this project: an exploration that ran as **26 separate model calls** was 26 independent commands — two `pf-exec` calls. Before you send a single command, ask what else you already know you will need and send the set. Parallel `Bash` calls in one message save the same turns but cap nothing, so prefer `pf-exec` whenever output size is uncertain:
>
>   ```
>   Tools/pf/pf-exec --cap 2k <<'EOF'
>   sig     : rg -n "class RowBadgeView" Assets/<sku>
>   slice   : read Assets/<sku>/Design/Tokens.cs:1-40
>   callers : rg -n "ItemViewFactory" Assets/<sku> -l
>   EOF
>   ```
>
>   It runs the items in parallel, marks each `EMPTY` / `TRUNCATED n->m` / `exit N`, and a failing item never aborts the others. `read FILE:L1-L2` replaces a `Read` call. Raise `--cap` for one item and rerun it alone when the cut mattered — that is one cheap turn against a blob you would otherwise carry to the end of the stage. Ordered shell — build, then test, then gate — is the same door with `--ordered --stop-on-fail --reduce auto`, so a red compile never pays for the test run behind it.
> - **Put every write you already know you need in ONE message.** Your host sends as many `Write` and `Edit` calls as you emit in a single assistant message, and runs them all before it calls you again — six files created together cost ONE turn, six files created one per step cost six, and each of those six re-sends your whole context. Measured on this project: the same six-file task costs 47k context tokens batched against 330k one-at-a-time. Only a write whose content depends on a result you have not seen yet earns its own turn.
> - **`Tools/pf/pf-write` is for the batch that must not half-apply**, not for batching as such — several files that have to land together or not at all. It validates every item before touching anything and rolls the whole tree back on any failure; paths must sit inside the working directory.
>
>   ```
>   Tools/pf/pf-write <<'EOF'
>   [ {"op":"edit","path":"Assets/<sku>/A.cs","old":"var x = 1;","new":"var x = 2;"},
>     {"op":"edit","path":"Assets/<sku>/B.cs","old":"foo(","new":"bar(","count":3},
>     {"op":"write","path":"Assets/<sku>/C.cs","text":"// whole file\n"},
>     {"op":"delete","path":"Assets/<sku>/Old.cs"} ]
>   EOF
>   ```
>
>   JSON, so nothing you write can collide with a delimiter. **All-or-nothing, the opposite of `pf-exec`:** every item is validated before anything is touched, and a failure mid-apply rolls the whole tree back — a half-applied batch of mutations is worse than no batch. `edit` needs exactly `count` occurrences (default 1) and refuses an ambiguous match rather than guessing it. `--dry-run` validates without writing. Group the edits you already know you need; an edit whose content depends on a test result you have not seen yet is not one of them.
> - **Never batch across a dependency.** Do not guess the output of a compile, a test run, an editor refresh, or a file you have not read yet. When the next call's input depends on this call's result, take the extra turn — that is what turns are for.
> - **Run the repo's test door, never a command you composed yourself.** A project's engine-free suite almost always carries tests that are deliberately outside a per-edit loop — a sweep, a soak, a fuzz — kept out by a filter its gate script owns (`DEFAULT_TEST_FILTER="TestCategory!=Slow"` in this layout). `dotnet test <project>` with no `--filter` runs them all. Measured on this project: one unfiltered invocation pulled in a 10 000-level generator sweep, sat at 98% CPU for over twenty minutes across four attempts in a single story, was killed as a hung test host, and cost ~35 minutes of wall clock — for a suite that takes 90 seconds behind the filter. So the engine-free rung is `sh Tools/pf/gate.sh`, and if you are about to type `dotnet test` with a project path and no filter, read the gate script first. Where the tree carries a `[Slow]` attribute the sweeps also ignore themselves unless `PF_RUN_SLOW=1`, so a `Skipped` line naming that flag is the expected result and not a problem to fix. **Cap anything whose termination you are unsure of** with `Tools/pf/pf-timeout SECONDS COMMAND …` — exit `124`, and it kills the child's whole process group, so a `dotnet test` that forked a `testhost` leaves no orphan holding the next run out. **macOS has no `timeout(1)`**: `timeout 480 …` is `command not found`, and re-running uncapped after that is where the cost lands.
> - **One red test run, one fix pass.** When a run comes back red, fix every error visible in that output before re-running. Fixing one error per cycle is the most expensive habit available to you.
> - **Read a file once.** Do not re-read a file you wrote or edited yourself unless something outside this session changed it. Your own edit already told you the new content.
> - **Type-check in the shell before you refresh Unity.** A compile error found by `dotnet build` is one Bash turn (~1 s cold, ~0.5 s incremental), no Editor state, ~200 tokens of output. Finding the same error through `assets-refresh` + `console-get-logs` is a domain reload + MCP round-trip + a log payload you carry for the rest of the stage. Run after any `.cs` edit before you touch `pf-mcp`:
>
>   ```
>   Tools/pf/typecheck-headless.sh                     # Domain / Application / Gen — pure C#, no Unity refs
>   Tools/pf/typecheck.sh Game.Views                   # any one assembly, with Unity refs
>   Tools/pf/typecheck.sh --changed                    # only asmdefs touched since HEAD
>   ```
>
>   Prints `OK  <asm>  (Ns)` on success; on failure prints deduped `error CS####` lines and exits non-zero. Cache in `Library/pf-typecheck/`. Escalate to `assets-refresh` **only** when typecheck is green but you need domain reload for a source-generator, ILPP, or AssetDatabase change. Cross-asmdef refs are resolved from `Library/ScriptAssemblies/<Asm>.dll`, so a stale prebuilt DLL there can hide a fresh signature break — refresh Unity once at the end of the stage to confirm.
> - **Drive Unity through `Tools/pf/pf-mcp`.** Every MCP result is pasted into your context verbatim and re-sent on every later turn, so a fat one is paid for the rest of the session — on this project `console-get-logs` has returned ~4 MB from a single unfiltered call. A verify sequence is also a *script*, not a series of decisions, so it costs one turn, not seven:
>
>   ```
>   Tools/pf/pf-mcp <<'EOF'
>   assets-refresh               {}
>   console-get-logs             {"count":20,"logType":"Error"}
>   editor-application-set-state {"state":"play"}
>   screenshot-game-view         {}
>   editor-application-set-state {"state":"stop"}
>   EOF
>   ```
>
>   `pf-mcp --timeout` is **seconds** and is forwarded to the CLI, whose own default is **60**: a `tests-run` that legitimately takes longer comes back `Tool call timed out after 60 seconds` while the Editor finishes the suite behind it. That is a client-side abort, not a Unity failure — raise `--timeout` rather than answering it with a `sleep`. A fixed `sleep 300` after an 88-second suite buys five minutes for ninety seconds of work, twice over, at full context.
>
>   **EditMode tests go through `Tools/pf/pf-tests`, never through `pf-mcp tests-run`.** It runs any set of classes as ONE synchronous Unity run (`runSynchronously`), reading the verdict from a file, so no MCP call stays open while tests run. Measured 2026-09-24 with the Editor unfocused: an unfocused Editor ticks ~6 times a second, so every MCP `tests-run` paid ~8-10 s before its first test, a 45-class sweep cost 10-13 min, and a whole-assembly `tests-run` hit the gateway's 300 s cap (HTTP 504). `pf-tests --all` runs the 38 fast classes (525 tests) in ~35-55 s. While you iterate, name the classes you touched: `Tools/pf/pf-tests MapArtTests MapScreenTests` takes seconds. At the end, run `Tools/pf/pf-tests --auto` ONCE as the receipt. That is the fast tier, plus the `[Category(EditorTestCategories.Slow)]` capture/floor tier (~260 s) only when the diff touches a path that draws. `INCOMPLETE … --wait <id>` is the turn budget, not a failure. `reused` is a pass: the inputs are identical to the last green run of that selection.
>
>   **Never write a `sleep` before a Unity call — `pf-mcp` already waits, and it waits correctly.** Every run probes the Editor first and blocks until it is free (`--wait-ready`, on by default, ceiling `--wait-ready-max`, default 600 s); against an idle Editor that costs ~1.4 s and prints nothing. A client abort does NOT abort Unity — the Editor is single-threaded and keeps running the suite — so when a call comes back `timed out`, `exit 1` or `Processing`, just **re-issue the same command**: it now waits instead of landing on a busy Editor. `pf-mcp: the Editor did not come free` means BUSY, not broken — raise `--wait-ready-max`. Measured on story 7.1, before this existed: one 300 s abort, three retries into a busy Editor, then a blind `sleep 240` — **11 minutes** spent on a suite that takes 2 min 49 s.
>
>   **Do not hand-roll that wait from `editor-application-get-state` flags.** Measured 2026-09-22 across a 169 s EditMode suite: `IsCompiling` and `IsUpdating` were **false at every probe, start to finish** — a running test suite is neither a compile nor an import. The flags read READY against an Editor a minute from free. What actually separates them is the probe's own *latency* (1.4 s idle · 6–21 s or no answer at all when busy), which is what `--wait-ready` measures. If you find yourself reading those two booleans to decide whether to wait, you are about to reproduce the bug.
>
>   **Two timeout ceilings, and the outer one is your host's.** `pf-timeout 1500 Tools/pf/pf-mcp --timeout 1400` still dies at your tool runner's own default (two minutes in Claude Code's `Bash`) unless you ALSO raise that tool's `timeout` parameter. This project sets `BASH_DEFAULT_TIMEOUT_MS=600000` in `.claude/settings.json`, so the default ceiling is 10 minutes here — but a longer call still needs the parameter. Setting only the inner one reads as a Unity failure and costs the whole wait twice.
>
>   Items run **in order** — the Editor is single-threaded — each payload reduced in the shell (`logs-brief`, `test-summary`, `screenshot-path`, `raw`; the default is chosen from the tool name). `--stop-on-fail` is the default, so a red compile never pays for the test run, the play-mode entry and the capture behind it. **`screenshot-path` returns a path, not pixels**: an image costs ~2.9k tokens of permanent context, so look at it with `Read` only once you actually need to judge it. This is the one place batching across a dependency is correct — the script sequences and inspects, you never guess a result. Keep the direct `mcp__…` tools for one-off calls whose result is already small (`editor-application-get-state`, `scene-list-opened`, a targeted `assets-find`). Detail: the `pf-gates` skill.
> - **Resolve tool schemas in one pass.** If the host defers tool schemas behind a search tool, search once for every tool this story will plausibly need, not once per tool.
> - **Do not read build output** — `Library/`, `Temp/`, `Logs/`, `obj/` are generated. (`.meta` files are source: read one when you need to resolve a GUID, not otherwise.)
>
> **Settle whichever section {spec_file} carries before you report.** Which one it is follows the story's `kind`, and you never substitute one for the other.
>
> **`kind: function` → `## Render Floor`. No vision model, no judge, no quota.** Capture the surface, then settle it with `python3 Tools/pf/pixel-probe.py --capture <png> --points Tools/UiGate/probes/<surface>.json`. It checks the capture is real before it checks anything in it: a frame of near-zero variance means the capture pipeline is broken, not that the work is wrong, and it exits `2` saying so rather than reporting defects that are not there. Then each point is settled against the colour `DesignTokens.cs` already fixes, to a CIE76 dE tolerance — exit `0` all clear, `1` drift.
>
> The points file is **generated, never typed**: `python3 Tools/pf/pixel-probe.py --generate Tools/UiGate/probes/<surface>.layout.json --out Tools/UiGate/probes/<surface>.json` resolves each point from an anchored rect and a token symbol, so a token change moves the probe with it. Add points by editing the layout and regenerating. The tool is framework-owned and arrives under `Tools/pf/` through the agent-doc sync; the `probes/` data beside it is this SKU's. Detail: the `pf-uigate` skill. A claim you can settle neither by probe nor by field assertion was mis-sorted at planning: it is aesthetic, it belongs to the finish epic, and the fix is to name it in your report — never to weaken it until it passes.
>
> **`kind: finish` → `## Visual Contract`. Judge, then diagnose, then edit — in that order.** Capture the surface, then run `Tools/pf/visual-judge.sh --spec {spec_file} --caller stage` and nothing else on the line: the contract's ```visual-judge block supplies every capture, every reference and the divergence notes, so the audit and the review lens judge exactly what you judged. Before you change anything in response to a `VIOLATED` row, put three images in front of you — the reference that row was judged against (its V-line cites it by image number), this capture, and the previous round's — and write into `## Implementation Notes`: the symptom you can see, the cause in the tokens or code that produces it, and the change you will make. Those images cost ~2.9k of context each and they earn it here; this is the one place in the run where looking is the work. Adjusting a value because a row came back red, without naming the cause, is exactly what turns one defect into four identical rounds.
>
> The judge is never asked what to change — it settles rows, you diagnose. It also decides when you stop, so you never count rounds yourself. Three bounds, all of them hard:
>
> - **Follow the judge's `LOOP:` line.** Every verdict ends with `[visual-judge] LOOP: round n/N · … · continue | stop (…) | done`. `continue` → one more fix pass. `stop (…)` → stop, and report every row still `VIOLATED` as open, quoting the reason. `done` → the contract is settled. Whether the budget is a fixed number of rounds or "while every round leaves fewer rows VIOLATED" is the project's policy (`UIGATE_LOOP_POLICY` / `UIGATE_LOOP_MAX_ROUNDS` in `Tools/UiGate/judge.conf`) — never change it mid-run.
> - **Only judge a capture that changed.** An identical capture is answered from the judge's cache and buys no new round — re-capture after every fix pass, or do not call the judge.
> - **Exit `3` (HALT) → stop there.** The same row stayed `VIOLATED` on pixels your edits did not move. Report it as `intent_gap` naming the row, and leave the remaining rounds unspent.
>
> **One round, one fix pass** applies to both: fix every claim the round returned before re-capturing, exactly as with a red test run.
>
> A `CANNOT-TELL` row is not a failure and not yours to force: it means an image cannot settle that claim. Name it in your report so the verification pass can turn it into a field assertion.
>
> **Write findings down before you finish.** Before your final report, append to {spec_file}'s `## Spec Change Log` every decision a later reader could not re-derive from the code, and every approach you ruled out with the evidence that ruled it out. Your context does not survive; the spec does.
>
> When done, report what you changed, how you verified it, and anything left incomplete or risky. Name every task from `## Tasks & Acceptance` you did not close, and for each unclosed task name the reason — outside your owned files, needs an env you were not given, or a genuine defect — so the next stage or the operator can act on it without re-deriving it.

The `<STAGE>` sentences, by the axis that chose the cut:

**No split (twenty-five bullets or fewer and twenty Code Map entries or fewer):** *Implement every task in `## Tasks & Acceptance`.*

**Axis 1 — file-disjoint groups** (name the group in place of `<GROUP>` — a `**Execution — Phase X**` sub-heading, a numbered section, or the shared directory that defines the group; use the planner's marker verbatim when it exists)
- Each stage: *Do the Execution bullets under `<GROUP>` and nothing outside it. Leave every other group to its own stage, and name any bullet you could not close.* — the second and later stages append: *Every prior group is already implemented and verified: read its output, do not rewrite it.*

**Axis 2 — environment / tool inventory** (name the env in place of `<ENV>` — one of: `headless-C#`, `unity-C#`, `unity-editor`, `external-tool`)
- Each stage: *Do only the Execution bullets whose tools land in `<ENV>`. Leave every bullet that needs a different env to its own stage, and name it in your report.* — the second and later stages append: *Every prior env is already implemented and verified: read its output, do not rewrite it.*

**Axis 3 — layer / dependency** (name the layer in place of `<LAYER>` — Domain, Application, Presentation, or the project's own layer names)
- Each stage: *Do the Execution bullets that belong to `<LAYER>` and nothing outside it.* — the second and later stages append: *Every prior layer is already implemented and verified: read it, do not rewrite it.*

**Axis 4 — bullet count** (fallback; name the cut point in place of `<CUT>`: the group heading you cut at, or the bullet's own file path)
- Stage A: *Do the Execution bullets of `## Tasks & Acceptance` from the first one up to and including `<CUT>`, and nothing after it. Leave the rest to the next stage, and name anything you could not close.*
- Stage B: *Do the Execution bullets of `## Tasks & Acceptance` after `<CUT>` through the end of the list, plus the open items named in the report below. Everything before the cut is already implemented and verified: read it, do not rewrite it.*

**Finish story — cut by surface** (name the surface or the batch in place of `<SURFACE>`)
- Each stage: *Bring `<SURFACE>` up to its `## Visual Contract` against the approved mockup that contract names, and touch no other surface. Diagnose before you edit, and stop at the bounds the contract sets.* — the second and later stages append: *Every prior surface is already settled and its reference capture accepted: do not re-open it.*

**Closeout stage** (exactly one per split, per the Closeout rule above; append the UNION of the owned globs of every stage whose files the unclosed bullets name, plus those bullets verbatim as their reporters wrote them)
- *Close only the bullets listed below, staying inside the file globs shown; report any bullet you still cannot close, and do not attempt further closeout.*
"""

# Review selection: "none" launches no lens and skips triage, "quick" runs
# quick_lenses, "thorough" runs thorough_lenses, "auto" follows the resolved
# route — oneshot selects quick, full selects thorough.

review = "auto"

# Review lenses for the review step, in two sets the review selection picks
# between. `instruction` is the lens's whole execution recipe — subagents by
# default, but an override may run anything (e.g. an external reviewer via
# bash). {diff_file}, {claims_file}, {spec_file}, and {verbatim_intent} are
# substituted at run time; the first three are paths, and {diff_file} is the
# unified diff file the lens reads. `when` (optional) gates a lens; empty
# `instruction` disables it.

[[workflow.quick_lenses]]
id = "quick"
name = "Quick"
instruction = """
Launch a context-free subagent with this prompt:

Read `{spec_file}` — the story or spec holding the acceptance criteria and intent; it is empty when there is none — and the files its frontmatter `context:` lists. Read the agent instruction files (`AGENTS.md`, `CLAUDE.md`, or equivalents) at the repository root and in the directories the diff touches; those are the rules. Then read the unified diff at `{diff_file}` — it is the change under review.

Report unmet acceptance criteria, broken rules, and bugs. Each finding: the location, what goes wrong, and evidence checked against the surrounding code. Output a Markdown list of findings only — no severity, priority, or ranking.

**Batch your reading.** Every turn re-sends your whole context, so N inspections in N turns bill that context N times. You inspect and report — you never edit — so almost nothing you look at depends on the previous result: put every independent read or grep of one round into ONE call. Use `Tools/pf/pf-exec` where the repo ships it (heredoc of `label : command` lines, run in parallel, each output capped, `read FILE:L1-L2` for a slice); otherwise put several reads in one message. Do not spend a turn checking whether it exists — run it; if the shell says command not found, that one failed call is your answer and you fall back to several reads in one message.

Do not invoke any skill, and do not spawn subagents of your own — you are the reviewer. Return your findings as text in your final message; do not route them through any findings-reporting tool the host may offer.

"""

[[workflow.thorough_lenses]]
id = "blind-hunter"
name = "Blind Hunter"
instruction = """
Launch a context-free subagent with this prompt:

Conduct a review of CONTENT.
Look for what's missing, not only what's wrong.
Compute a finding CEILING N from the diff file's size: N = min(floor(sqrt(kB) + 1), 6), where kB is the file's size in kilobytes. State the arithmetic in one line, then report **at most N** findings — the N most consequential, ordered worst first. Fewer is right when fewer is what you found; an empty list is a valid answer for a clean diff. Never pad to reach a count, and never report a wording or comment nit while a behavioural defect is unreported.
Each finding is three sentences at most: where (`file:line`), what is wrong, and what goes wrong if it ships. No preamble, no closing summary.
Output a Markdown list of findings only — no severity, priority, or ranking.
If the content is empty, stop and say so.

CONTENT: the unified diff at `{diff_file}`. Read that file — it is the content under review.

**Batch your reading.** Every turn re-sends your whole context, so N inspections in N turns bill that context N times. You inspect and report — you never edit — so almost nothing you look at depends on the previous result: put every independent read or grep of one round into ONE call. Use `Tools/pf/pf-exec` where the repo ships it (heredoc of `label : command` lines, run in parallel, each output capped, `read FILE:L1-L2` for a slice); otherwise put several reads in one message. Do not spend a turn checking whether it exists — run it; if the shell says command not found, that one failed call is your answer and you fall back to several reads in one message.

Do not invoke any skill, and do not spawn subagents of your own — you are the reviewer. Return your findings as text in your final message; do not route them through any findings-reporting tool the host may offer.

"""

