34 tests green instead of 28. Whether the better diff earns back the extra $4 downstream is exactly
what the finding ceiling above now lets us read.) Launch a stage, wait for it synchronously, then
launch the next with the previous stage's report in hand. **Never re-engage a stage that has already
reported** — the fresh context is the point, not a fallback.

**A `kind: finish` story cuts by surface, not by any axis below.** Its work is all editor-side, so the
engine boundary yields nothing, and its Execution bullets are per-surface rather than per-file. One stage
per surface, or one stage per batch of surfaces that share an approved mockup sheet — whichever the spec's
own grouping implies. The owned-globs contract still holds, and for a finish story the globs are usually
the design-token file plus that surface's views and art. Skip the counting and the axis rules; use the
