execution bullets or fewer, and twenty Code Map entries or fewer: one stage** — launch it with the whole
spec, skip the rest of this section, and use the single-stage sentence below. Over either number, split
along the axis rules below. (The thresholds are calibrated on this repo's shipped specs: 17/12 for the
cheapest story, 30/24 and 60/39 for the two that overran.)

**Choose the cut axis — take the first axis that yields a real boundary, then apply it.** The number of
stages equals the number of cuts plus one; there is no hard cap on stage count. What is capped is the
file-ownership contract further down: every cut must produce owned file globs that do not overlap. Small
stories rarely need more than two stages; a 60-bullet spec in this epic set naturally cuts into three.

1. **File-disjoint groups.** Group the Execution bullets by the file(s) each one touches (the leading
   `` `FILE` `` token in the bullet names it). If the bullets can be partitioned into ≥2 groups whose
   file globs do not overlap, cut on those group boundaries. This is the strongest axis because a
   disjoint cut cannot produce cross-stage rewrites by construction. When the spec already carries
   semantic sub-groupings (`**Execution — Phase X**` sub-headings, numbered sections, or comparable
   markers), prefer those group boundaries when their files are disjoint — the planner has already read
