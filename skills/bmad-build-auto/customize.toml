implementation_handoff = """
Implement in **stages, each stage its own subagent**. One context carried across a whole spec grows
until every turn re-reads it: the measured single-agent run reached 285 turns and a 742k peak context
and cost $30.74, against $8.11 for the same story split in two — 320k and 309k peaks, and neither stage
rewrote a file the other had written. Every stage runs with **no prior conversation context**, on the
